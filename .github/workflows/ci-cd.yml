name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: armanmikoyan/plateai

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to AWS EC2
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment-info.outputs.url }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      AI_TEST_MODE: ${{ vars.AI_TEST_MODE }}
      AI_IMAGE_PROVIDER: ${{ vars.AI_IMAGE_PROVIDER }}
      AI_IMAGE_MODEL: ${{ vars.AI_IMAGE_MODEL }}
      AI_PROVIDER_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
    steps:
      - name: Set deployment URL
        id: deployment-info
        run: echo "url=${{ env.PRODUCTION_URL }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            docker pull ${{ env.DOCKER_IMAGE }}:latest
            docker stop plateai 2>/dev/null || true
            docker rm plateai 2>/dev/null || true
            docker stop mealai 2>/dev/null || true
            docker rm mealai 2>/dev/null || true
            docker run -d \
              --name plateai \
              --restart unless-stopped \
              -p 3000:3000 \
              -e AI_TEST_MODE="${{ env.AI_TEST_MODE }}" \
              -e AI_IMAGE_PROVIDER="${{ env.AI_IMAGE_PROVIDER }}" \
              -e AI_IMAGE_MODEL="${{ env.AI_IMAGE_MODEL }}" \
              -e AI_PROVIDER_API_KEY="${{ env.AI_PROVIDER_API_KEY }}" \
              ${{ env.DOCKER_IMAGE }}:latest
            docker image prune -f

      - name: Deployment summary
        run: 'echo "Live app: ${{ steps.deployment-info.outputs.url }}"'
